name: StockPilot US Market (Night)
on:
  schedule:
    # 미국 장 + 프리마켓 (KST 22:00~06:00 = UTC 13:00~21:00) 30분 간격
    - cron: '0,30 13-20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  us-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT로 푸시해야 봇 커밋이 '사람 활동'으로 잡혀 스케줄 60일 자동중단을 막음 (없으면 기존 토큰 폴백)
          token: ${{ secrets.PAT || github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run US market collector
        run: python us_market.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out
          test -f us_market.json && cp us_market.json /tmp/out/us_market.json
          git fetch origin main
          git reset --hard origin/main
          test -f /tmp/out/us_market.json && cp /tmp/out/us_market.json us_market.json && git add us_market.json
          git diff --cached --quiet || git commit -m "auto: us-market $(date +'%Y%m%d %H%M')"
          git push
