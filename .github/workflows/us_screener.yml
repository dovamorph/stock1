name: StockPilot US Market (Night)
on:
  schedule:
    # 미국 장 + 프리마켓 (KST 22:00~06:00 = UTC 13:00~21:00) 30분 간격
    - cron: '0,30 13-20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  us-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests

      - name: Run US market collector
        run: python us_market.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us_market.json
          git diff --cached --quiet || git commit -m "auto: us-market $(date +'%Y%m%d %H%M')"
          git pull --rebase origin main
          git push
