name: StockPilot KR Screener

on:
  schedule:
    - cron: '30 23 * * 0-4'    # 월~금 08:30 KST
    - cron: '0,30 0-8 * * 1-5' # 월~금 09:00~17:30 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas finance-datareader yfinance

      - name: Run screener
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python screener.py

      - name: Run trader (모의투자)
        env:
          KIS_APP_KEY_MOCK:    ${{ secrets.KIS_APP_KEY_MOCK }}
          KIS_APP_SECRET_MOCK: ${{ secrets.KIS_APP_SECRET_MOCK }}
          KIS_ACCOUNT_MOCK:    ${{ secrets.KIS_ACCOUNT_MOCK }}
          DISCORD_WEBHOOK:     ${{ secrets.DISCORD_WEBHOOK }}
          KIS_MOCK:            "true"
        run: python trader.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json positions.json index.html
          git diff --cached --quiet || git commit -m "auto: screener+trader $(date +'%Y%m%d %H%M')"
          git push
