name: StockPilot KR Screener

on:
  schedule:
    - cron: '30,40,50 23 * * 0-4'       # 08:30/08:40/08:50 KST (장 전)
    - cron: '0,10,20,30,40,50 0 * * 1-5' # 09:00~09:50 KST (10분마다)
    - cron: '0,10,20,30,40,50 1 * * 1-5' # 10:00~10:50 KST (10분마다)
    - cron: '0,10,20,30,40,50 2 * * 1-5' # 11:00~11:50 KST (10분마다)
    - cron: '0,10,20,30 3 * * 1-5'       # 12:00~12:30 KST (10분마다)
    - cron: '0,30 4-8 * * 1-5'           # 13:00~17:30 KST (30분마다)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas finance-datareader yfinance beautifulsoup4 pykrx

      - name: Run screener
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:  ${{ secrets.KIS_ACCOUNT_NO }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python screener.py

      - name: Run trader
        env:
          KIS_APP_KEY_MOCK:    ${{ secrets.KIS_APP_KEY_MOCK }}
          KIS_APP_SECRET_MOCK: ${{ secrets.KIS_APP_SECRET_MOCK }}
          KIS_ACCOUNT_MOCK:    ${{ secrets.KIS_ACCOUNT_MOCK }}
          DISCORD_WEBHOOK:     ${{ secrets.DISCORD_WEBHOOK }}
          KIS_MOCK:            "true"
        run: python trader.py

      - name: Run expiry analysis
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python expiry.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json positions.json expiry_result.json index.html
          git diff --cached --quiet || git commit -m "auto: screener+trader $(date +'%Y%m%d %H%M')"
          git push
