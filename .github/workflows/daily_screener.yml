name: StockPilot KR Screener
on:
  schedule:
    # 08:00~08:50 KST = 23:00~23:50 UTC (일~목)
    - cron: '*/10 23 * * 0-4'
    # 09:00~15:50 KST = 00:00~06:50 UTC (월~금)
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests pandas finance-datareader yfinance beautifulsoup4 pykrx numpy
      - name: Run screener
        env:
          KIS_APP_KEY:     ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:  ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO:  ${{ secrets.KIS_ACCOUNT_NO }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python screener.py
      - name: Run expiry analysis
        run: python expiry.py
      - name: Run trader
        env:
          KIS_APP_KEY_MOCK:    ${{ secrets.KIS_APP_KEY_MOCK }}
          KIS_APP_SECRET_MOCK: ${{ secrets.KIS_APP_SECRET_MOCK }}
          KIS_ACCOUNT_MOCK:    ${{ secrets.KIS_ACCOUNT_MOCK }}
          DISCORD_WEBHOOK:     ${{ secrets.DISCORD_WEBHOOK }}
          KIS_MOCK:            "true"
        run: python trader.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json positions.json expiry_result.json
          test -f market_history.json && git add market_history.json || true
          test -f candidates_cache.json && git add candidates_cache.json || true
          git diff --cached --quiet || git commit -m "auto: screener+trader $(date +'%Y%m%d %H%M')"
          git pull --rebase origin main
          git push
