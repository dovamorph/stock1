name: Market Indicators

on:
  schedule:
    - cron: '15,45 * * * *'   # 매시 15분, 45분 (screener와 충돌 방지)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-indicators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT로 푸시해야 봇 커밋이 '사람 활동'으로 잡혀 스케줄 60일 자동중단을 막음 (없으면 기존 토큰 폴백)
          token: ${{ secrets.PAT || github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run market indicators
        run: python market_indicators.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out
          for f in market_indicators.json market_indicators_history.json; do
            test -f "$f" && cp "$f" "/tmp/out/$f"
          done
          git fetch origin main
          git reset --hard origin/main
          for f in market_indicators.json market_indicators_history.json; do
            test -f "/tmp/out/$f" && cp "/tmp/out/$f" "$f" && git add "$f"
          done
          git diff --cached --quiet || git commit -m "market: $(date +'%Y%m%d %H%M')"
          git push
