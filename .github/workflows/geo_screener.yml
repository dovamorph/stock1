name: Geo Analysis

on:
  schedule:
    - cron: '0 */2 * * *'   # 매 2시간마다 (24/7, 주말 포함)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 yfinance pandas numpy

      - name: Run geo analysis
        run: python geo_analysis.py

      - name: Run event tracker
        run: python event_tracker.py

      - name: Run market regime
        run: python market_regime.py
        continue-on-error: true   # 실패해도 geo/sector 커밋은 진행

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/out
          for f in geo_result.json sector_risk.json regime_cache.json; do
            test -f "$f" && cp "$f" "/tmp/out/$f"
          done
          git fetch origin main
          git reset --hard origin/main
          for f in geo_result.json sector_risk.json regime_cache.json; do
            test -f "/tmp/out/$f" && cp "/tmp/out/$f" "$f" && git add "$f"
          done
          git diff --cached --quiet || git commit -m "geo: $(date +'%Y%m%d %H%M')"
          git push
